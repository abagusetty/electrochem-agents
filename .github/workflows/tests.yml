name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency-free test requirements
        run: pip install -r requirements-dev.txt numpy
      - name: Run tests (pure-numpy modules only; ase/fairchem/CP-MACE skipped in CI)
        run: python -m pytest tests/ -v
